version: 2

models:
  - name: mart_daily_revenue
    columns:
      - name: date
        data_tests:
          - unique
          - not_null

  - name: mart_sales_by_category
    columns:
      - name: category
        data_tests:
          - not_null

  - name: mart_customers
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null

  - name: fct_orders
    description: "Одна строка на заказ в любом статусе. Продажа = completed или refunded; чистая выручка = выручка - возвраты; валовая прибыль = чистая выручка - себестоимость."
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: order_date
        data_tests:
          - not_null
      - name: status
        data_tests:
          - accepted_values:
              values: ['completed', 'refunded', 'cancelled', 'pending', 'processing']
      - name: customer_type
        description: "new = первая покупка клиента, returning = повторная; пусто для непроданных заказов"
        data_tests:
          - accepted_values:
              values: ['new', 'returning']
      - name: gross_revenue
        description: "Сумма заказа, если он продан (completed или refunded), иначе 0"
      - name: net_revenue
        description: "gross_revenue - refund_amount"
      - name: cost_amount
        description: "Себестоимость товаров completed-заказа (quantity * cost_price)"
      - name: gross_profit
        description: "net_revenue - cost_amount"

  - name: fct_order_items
    description: "Строки заказов с признаками заказа (канал, регион, статус) и товара (категория). Возврат распределён по строкам пропорционально сумме."
    columns:
      - name: order_item_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: category
        data_tests:
          - not_null

  - name: mart_monthly_kpi
    description: "KPI по месяцам и сравнение с прошлым месяцем: рост выручки, заказов, среднего чека, новых клиентов (в долях) и изменение маржи и доли отмен (в процентных пунктах)."
    columns:
      - name: month
        data_tests:
          - unique
          - not_null
