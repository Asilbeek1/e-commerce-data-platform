
services:
  postgres:
    image: postgres:16
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: dev_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    profiles: ["tools"]
    working_dir: /usr/app
    volumes:
      - ./dbt/ecommerce_analytics:/usr/app
      - ./dbt/profiles.yml:/root/.dbt/profiles.yml:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DBT_PROFILES_DIR: /root/.dbt

volumes:
  postgres_data:

